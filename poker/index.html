<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>West Coast Poker — Play Money Hold'em</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo">WC</div>
      <div>
        <div class="brand-name">West Coast Poker</div>
        <div class="brand-sub">Play-money No-Limit Hold'em</div>
      </div>
    </div>
    <div class="topbar-actions">
      <div class="bankroll">
        <span class="muted">Bankroll</span>
        <strong id="bankroll">—</strong>
      </div>
      <button id="settingsBtn" class="btn">Settings</button>
    </div>
  </header>

  <main class="table-wrap">
    <div class="felt">
      <div class="seats" id="seats"></div>

      <div class="center">
        <div class="board" id="board"></div>
        <div class="pot">
          <span class="muted">Pot</span>
          <strong id="pot">0</strong>
        </div>
        <div class="stage-label" id="stageLabel">Press “Deal” to start</div>
      </div>
    </div>

    <div class="log-panel">
      <div class="log-head">Hand log</div>
      <ul class="log" id="log"></ul>
    </div>
  </main>

  <footer class="actionbar" id="actionbar">
    <div class="action-buttons" id="actionButtons">
      <button id="dealBtn" class="btn btn-primary btn-lg">Deal next hand</button>
    </div>
    <div class="bet-controls hidden" id="betControls">
      <div class="bet-readout">
        <span class="muted">Amount</span>
        <strong id="betAmount">0</strong>
      </div>
      <input type="range" id="betSlider" min="0" max="100" step="1" value="0" />
      <div class="bet-quick" id="betQuick"></div>
    </div>
  </footer>

  <!-- Settings dialog -->
  <dialog id="settingsDialog" class="dialog">
    <form method="dialog" class="dialog-body" id="settingsForm">
      <h2>Table settings</h2>
      <p class="muted">Changes apply on the next hand.</p>

      <label class="field">
        <span>Opponents (bots)</span>
        <select id="setBots">
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3" selected>3</option>
          <option value="4">4</option>
          <option value="5">5</option>
        </select>
      </label>

      <label class="field">
        <span>Starting stack</span>
        <select id="setStack">
          <option value="1000">1,000</option>
          <option value="2000" selected>2,000</option>
          <option value="5000">5,000</option>
          <option value="10000">10,000</option>
        </select>
      </label>

      <label class="field">
        <span>Big blind</span>
        <select id="setBlind">
          <option value="20">10 / 20</option>
          <option value="40" selected>20 / 40</option>
          <option value="100">50 / 100</option>
        </select>
      </label>

      <div class="dialog-actions">
        <button type="button" id="resetBankroll" class="btn btn-ghost">Reset bankroll</button>
        <div class="spacer"></div>
        <button value="cancel" class="btn btn-ghost">Close</button>
        <button value="save" id="saveSettings" class="btn btn-primary">Save &amp; restart table</button>
      </div>
    </form>
  </dialog>

  <script src="poker.js"></script>
</body>
</html>
